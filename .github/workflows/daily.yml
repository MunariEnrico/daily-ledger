name: Daily edition

# GitHub runs cron schedules in UTC (the `timezone` key used before was ignored:
# every edition went out around 09:00 instead of 08:00). The triggers below are
# in UTC and cover both CET (winter) and CEST (summer); `python -m ledger auto`
# reads the Europe/Luxembourg clock and decides what to do, so extra triggers
# are harmless and a published edition is never rebuilt or re-sent.
#   03:30 UTC  = 04:30 CET / 05:30 CEST   (summer: build now, wait in-job, publish 08:00)
#   04:30 UTC  = 05:30 CET / 06:30 CEST   (winter: build now, wait in-job, publish 08:00)
#   05:40 UTC  = 06:40 CET / 07:40 CEST   backup if an earlier trigger was dropped
#   06:40 UTC  = 07:40 CET / 08:40 CEST   backup
# The build job waits until 07:57 local and publishes itself, so publication no
# longer depends on GitHub starting a second run on time.
on:
  schedule:
    - cron: '30 3 * * *'
    - cron: '30 4 * * *'
    - cron: '40 5 * * *'
    - cron: '40 6 * * *'
  workflow_dispatch:
    inputs:
      command:
        description: 'auto | build | publish | redraft --force | render | sources'
        default: 'auto'
        required: true

permissions:
  contents: write    # commit the archive in data/
  pages: write       # deploy the site
  id-token: write

concurrency:
  group: daily-ledger
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      deploy: ${{ steps.run.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the newsroom
        id: run
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SITE_URL: ${{ vars.SITE_URL }}
          LEDGER_CONTACT_URL: https://github.com/${{ github.repository }}
          LOG_LEVEL: INFO
        run: |
          python -m ledger ${{ inputs.command || 'auto' }}
          [ -d _site ] || python -m ledger render
          grep -q '^deploy=' "$GITHUB_OUTPUT" || echo "deploy=true" >> "$GITHUB_OUTPUT"
      - name: Commit archive and audit trail
        if: always()
        run: |
          git config user.name  "daily-ledger-bot"
          git config user.email "daily-ledger-bot@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Edition data $(TZ=Europe/Luxembourg date '+%Y-%m-%d %H:%M %Z')"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
      - uses: actions/upload-pages-artifact@v4
        if: steps.run.outputs.deploy == 'true'
        with:
          path: _site

  deploy:
    needs: edition
    if: needs.edition.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
