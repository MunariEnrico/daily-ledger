name: Tests
on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'     # weekly: also re-check that every registered feed still works
      timezone: 'Europe/Luxembourg'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Check registered feeds (weekly)
        if: github.event_name == 'schedule'
        run: python -m ledger sources --check
