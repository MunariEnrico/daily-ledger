# Agencies whose wire copy is commonly reproduced. An item crediting one of
# these is attributed to that agency for independence counting.
agency_markers:
  ansa: ["(ansa)", "ansa)", "- ansa", "fonte ansa"]
  agi: ["(agi)", "- agi"]
  adnkronos: ["(adnkronos)", "adnkronos"]
  lapresse: ["(lapresse)", "lapresse"]
  reuters: ["(reuters)", "reuters -", "reuters reported", "secondo reuters", "according to reuters", "reuters)"]
  afp: ["(afp)", "afp -", "agence france-presse", "according to afp"]
  ap: ["(ap)", "associated press"]
  dpa: ["(dpa)", "dpa -"]
  bloomberg: ["(bloomberg)", "according to bloomberg", "secondo bloomberg", "bloomberg reported", "bloomberg news"]

