# THE DAILY LEDGER — Source registry
#
# Every feed below was fetched and parsed successfully on 2026-10-28 from the
# development environment (HTTP 200, entries present, newest entry < 15 days old
# unless noted). Feeds that were tested and are NOT usable are listed in
# docs/SOURCES.md with the reason — do not add a feed here without testing it:
#     python -m ledger sources --check
#
# Fields
#   id        unique slug                    owner     ownership group; items from the same
#   name      publication / institution                owner never count as independent
#   feed      verified RSS/Atom endpoint                 corroboration
#   home      official site                  type      official | agency | newspaper |
#   country   ISO-like code (IT US UK FR LU EU DE CN IN JP ME INT)    broadcaster | magazine | local | specialist
#   lang      it en fr de lb pt              tier      1 official · 2 agency/major · 3 national/specialist · 4 opinion-led / tabloid
#   geo       countries covered              cities    city editions this source serves
#   topics    topic hints (finance economics politics society tax law crime culture travel housing transport)
#   paywall   article pages usually paywalled (we never bypass; we only use feed text)
#   fulltext  official public documents whose pages we may fetch (robots.txt respected)

defaults: {enabled: true, paywall: false, fulltext: false, cities: [], topics: []}

